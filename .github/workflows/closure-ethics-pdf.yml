name: Build Closure Ethics implementation PDF

on:
  push:
    branches:
      - main
    paths:
      - '09-implementation/**'
      - '11-communication/**'
      - '12-standard/**'
      - '.github/workflows/closure-ethics-pdf.yml'
  pull_request:
    branches:
      - main
    paths:
      - '09-implementation/**'
      - '11-communication/**'
      - '12-standard/**'
      - '.github/workflows/closure-ethics-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closure-ethics-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-pdf:
    name: Build Closure Ethics PDF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PDF dependency
        run: python -m pip install --disable-pip-version-check reportlab
      - name: Run Closure Ethics governor tests
        working-directory: 09-implementation
        run: python -m unittest -v test_reference.py
      - name: Run Omega Sentinel boundary tests
        working-directory: 09-implementation/omega-sentinel
        run: python -m unittest -v test_omega_sentinel.py
      - name: Run Universal Closure Protocol tests
        working-directory: 11-communication
        run: python -m unittest -v test_closure_protocol.py
      - name: Build PDF
        run: python 09-implementation/build_pdf.py
      - name: Verify generated PDF
        run: test -s docs/downloads/Closure_Ethics_Implementation_Spec_v0.1.pdf
